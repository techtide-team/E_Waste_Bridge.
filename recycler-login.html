
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recycler Login | E-Waste Bridge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">
        <h1>E-Waste Bridge</h1>
        <p>Recycler Portal Login</p>

        <form id="recyclerLoginForm">

            <label>Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login</button>

                       <p id="loginMessage"></p>

        </form>

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>

    </div>

    <script type="module" src="recycler-login.js"></script>

</body>
</html>
